<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagesmith</title>
    <link rel="stylesheet" href="../../ui/base.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="/icons/icon32.png" width="20" height="20" alt="" />
        <strong>Pagesmith</strong>
      </header>

      <p id="status" role="status" aria-live="polite" data-i18n="popupPreparing">Preparing the page…</p>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="bar-fill"></div>
      </div>
      <p id="hint" class="muted" data-i18n="popupHint">You can close this popup. The capture continues and opens when it is done.</p>
      <p id="error" class="error" hidden></p>

      <footer>
        <button id="retry" class="primary" hidden data-i18n="btnRetry">Try again</button>
        <button id="recent" data-i18n="btnRecent">Recent captures</button>
        <button id="options" data-i18n="btnOptions">Options</button>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
