<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>App shell fixture</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body { display: grid; grid-template-columns: 200px 1fr; }
      nav { background: rgb(40, 40, 40); }
      main { overflow-y: auto; }
      .row { height: 400px; }
    </style>
  </head>
  <body>
    <!-- The document never scrolls; <main> does. Webmail and dashboards are
         built like this, and a window-only capture returns one screenful. -->
    <nav></nav>
    <main>
      <div class="row" style="background: rgb(220, 30, 30)"></div>
      <div class="row" style="background: rgb(30, 220, 30)"></div>
      <div class="row" style="background: rgb(30, 30, 220)"></div>
      <div class="row" style="background: rgb(220, 220, 30)"></div>
      <div class="row" style="background: rgb(30, 220, 220)"></div>
      <div class="row" style="background: rgb(220, 30, 220)"></div>
    </main>
  </body>
</html>
